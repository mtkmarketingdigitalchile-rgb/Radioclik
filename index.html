    <meta name="description" content="Escucha Radio Clik Chile en vivo por Internet. Música, entretenimiento y compañía las 24 horas.">

    <style>

            font-size: 32px;

        .subtitle {

        .live {
            display: inline-block;

            margin: 12px 0 20px;

        .status.connected {
            color: #25D366;
        }

        .status.error {
            color: #ff5555;
        }

        .button {
            display: block;

            padding: 15px;

            border-radius: 12px;

            transition: 0.3s;
        }

            transform: scale(1.02);
            background: #e50914;
        }

            background: #25D366;
        }

        .share {
            background: #444444;
            cursor: pointer;
            border: none;

<body>

    <div class="radio-container">

        <div class="logo">
            RC
        </div>

        <h1>Radio Clik Chile</h1>

        <p class="subtitle">
            Tu compañía estés donde estés
        </p>

        <div class="live">
            🔴 EN VIVO
        </div>

        <div class="player">

            <audio id="radioPlayer" controls preload="none">
                <source
                    src="https://uk19freenew.listen2myradio.com/live.mp3?typeportmount=s2_34828_stream_210725583"
                    type="audio/mpeg">
                
                Tu navegador no puede reproducir esta radio.
            </audio>

        </div>

        <div id="status" class="status">
            ⏸️ Radio detenida. Presiona ▶ para escuchar.
        </div>

        <a class="button whatsapp"
           href="https://wa.me/56941779020"
           target="_blank"
           rel="noopener noreferrer">
            📱 Contactar por WhatsApp
        </a>

        <button class="button share" onclick="compartirRadio()">
            🔗 Compartir Radio Clik
        </button>

        <footer>
            © 2026 Radio Clik Chile
            <br>
            Radio online por Internet
        </footer>

    </div>

    <script>

        const radioPlayer = document.getElementById("radioPlayer");
        const status = document.getElementById("status");

        const streamURL =
            "https://uk19freenew.listen2myradio.com/live.mp3?typeportmount=s2_34828_stream_210725583";

        let reconnectTimer = null;

        function actualizarEstado(texto, clase = "") {
            status.textContent = texto;
            status.className = "status " + clase;
        }

        radioPlayer.addEventListener("play", function () {
            actualizarEstado(
                "🟢 Conectando con Radio Clik Chile...",
                "connected"
            );
        });

        radioPlayer.addEventListener("playing", function () {
            actualizarEstado(
                "🟢 Radio Clik Chile está transmitiendo en vivo",
                "connected"
            );
        });

        radioPlayer.addEventListener("waiting", function () {
            actualizarEstado(
                "⏳ Conectando con la señal...",
                ""
            );
        });

        radioPlayer.addEventListener("pause", function () {
            actualizarEstado(
                "⏸️ Radio detenida. Presiona ▶ para escuchar."
            );
        });

        radioPlayer.addEventListener("error", function () {

            actualizarEstado(
                "🔴 No se pudo conectar. Reintentando...",
                "error"
            );

            programarReconexión();
        });

        radioPlayer.addEventListener("stalled", function () {

            actualizarEstado(
                "⚠️ Señal temporalmente interrumpida. Reconectando...",
                "error"
            );

            programarReconexión();
        });

        function programarReconexión() {

            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }

            reconnectTimer = setTimeout(function () {

                radioPlayer.src = streamURL;
                radioPlayer.load();

                radioPlayer.play().catch(function () {
                    actualizarEstado(
                        "▶ Presiona reproducir para volver a escuchar."
                    );
                });

            }, 5000);
        }

        function compartirRadio() {

            if (navigator.share) {

                navigator.share({
                    title: "Radio Clik Chile",
                    text: "Escucha Radio Clik Chile en vivo",
                    url: window.location.href
                });

            } else {

                navigator.clipboard.writeText(window.location.href);

                alert("¡Enlace de Radio Clik copiado!");

            }
        }

    </script>

</body>
</html>
